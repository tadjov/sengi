schema_version: 1
id: cc_news_fuzzy_v1
name: "cc-news fuzzy v1"
description: "Typo-tolerant search over cc-news: 30 queries, 10 with one misspelt word, 10 harder, 10 spelled correctly"
version: "1.2.0"

corpus:
  name: cc-news-canonical@v1
  source: "sha256:7cdf4c719dc70cd013a1eb76fa33688564dc99af03ddf8cc57d20952cd4c89a3 (datasets/cc-news/canonical/v1/datapackage.json)"

templates:
  - id: pg_multi_field
    args: [terms, rank_norm, limit]
    query: |
      SELECT id FROM articles
      WHERE search_vector @@ plainto_tsquery('english', $1)
      ORDER BY ts_rank(search_vector, plainto_tsquery('english', $1), $2::int) DESC, id
      LIMIT $3::int

  - id: pdb_multi_field_boosted
    args: [terms, limit]
    query: |
      SELECT id FROM articles
      WHERE id @@@ paradedb.boolean(
        should => ARRAY[
          paradedb.boost(3.0, paradedb.match('title', $1)),
          paradedb.boost(2.0, paradedb.match('description', $1)),
          paradedb.match('content', $1)
        ]
      )
      ORDER BY pdb.score(id) DESC, id
      LIMIT $2::int

  - id: tiger_multi_field
    args: [terms, limit]
    query: |
      WITH matched AS MATERIALIZED (
        SELECT id, search_text FROM articles WHERE search_text @@ plainto_tsquery('english', $1)
      )
      SELECT id FROM matched
      ORDER BY search_text <@> to_bm25query($1, 'idx_articles_bm25'), id
      LIMIT $2::int

  - id: es_multi_match_boosted
    args: [terms]
    query: |
      {"query": {"multi_match": {"query": "{{terms}}", "fields": ["title^3", "description^2", "content"]}}, "size": 100, "sort": ["_score", {"id": "asc"}], "_source": false, "track_total_hits": false}

  - id: es_fuzzy
    args: [terms]
    query: |
      {"query": {"multi_match": {"query": "{{terms}}", "fields": ["title^3", "description^2", "content"], "fuzziness": "AUTO"}}, "size": 100, "sort": ["_score", {"id": "asc"}], "_source": false, "track_total_hits": false}

  # Trigram similarity of the query to the title, at pg_trgm's default threshold:
  # the approach most people reach for first.
  - id: pg_trgm_title
    args: [terms, limit]
    query: |
      SELECT id FROM articles
      WHERE $1 <% title
      ORDER BY word_similarity($1, title) DESC, id
      LIMIT $2::int

  - id: pg_fuzzy
    args: [terms, rank_norm, limit]
    query: |
      SELECT a.id FROM articles a, fuzzy_tsquery($1) AS q
      WHERE a.search_vector @@ q
      ORDER BY ts_rank(a.search_vector, q, $2::int) DESC, a.id
      LIMIT $3::int

  - id: tiger_fuzzy
    args: [terms, limit]
    query: |
      SELECT id FROM articles
      ORDER BY search_text <@> to_bm25query(fuzzy_words($1), 'idx_articles_bm25'), id
      LIMIT $2::int

queries:
  - id: typo-hurricane-harvey
    text: "hurricane harvy"
    description: "Articles about Hurricane Harvey"
    category: typo
    engines:
      pg-fuzzy:
        template: pg_fuzzy
        params: { terms: "hurricane harvy", limit: 100 }
      tiger-fuzzy:
        template: tiger_fuzzy
        params: { terms: "hurricane harvy", limit: 100 }
      paradedb-fuzzy: |
        SELECT id FROM articles
        WHERE id @@@ paradedb.boolean(should => ARRAY[
            paradedb.boost(3.0, paradedb.match('title', 'hurricane', distance => 2)),
            paradedb.boost(3.0, paradedb.match('title', 'harvy', distance => 1)),
            paradedb.boost(2.0, paradedb.match('description', 'hurricane', distance => 2)),
            paradedb.boost(2.0, paradedb.match('description', 'harvy', distance => 1)),
            paradedb.match('content', 'hurricane', distance => 2),
            paradedb.match('content', 'harvy', distance => 1)
        ])
        ORDER BY pdb.score(id) DESC, id
        LIMIT 100
      es-fuzzy:
        template: es_fuzzy
        params: { terms: "hurricane harvy" }
      pg-trgm:
        template: pg_trgm_title
        params: { terms: "hurricane harvy", limit: 100 }
      pg-gin:
        template: pg_multi_field
        params: { terms: "hurricane harvy", limit: 100 }
      paradedb:
        template: pdb_multi_field_boosted
        params: { terms: "hurricane harvy", limit: 100 }
      tiger:
        template: tiger_multi_field
        params: { terms: "hurricane harvy", limit: 100 }
      elasticsearch:
        template: es_multi_match_boosted
        params: { terms: "hurricane harvy" }
      pg-gin-spelled:
        template: pg_multi_field
        params: { terms: "hurricane harvey", limit: 100 }

