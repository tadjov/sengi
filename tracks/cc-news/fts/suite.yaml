      paradedb:
        template: pdb_multi_field_boosted
        params: { terms: "net neutrality", limit: 100 }
      tiger:
        template: tiger_multi_field
        params: { terms: "net neutrality", limit: 100 }
      elasticsearch:
        template: es_multi_match_boosted
        params: { terms: "net neutrality" }

