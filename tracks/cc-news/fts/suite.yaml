  - id: bool-tesla-musk-or-model
    text: "tesla AND (musk OR model)"
    description: "Articles about Tesla that mention Musk or a Tesla model"
    category: boolean
    engines:
      pg-gin:
        template: pg_boolean
        params: { tsquery_expr: "tesla & (musk | model)", limit: 100 }
      paradedb: |
        SELECT id FROM articles
        WHERE id @@@ paradedb.boolean(
          must => ARRAY[
            paradedb.boolean(should => ARRAY[paradedb.match('title', 'tesla'), paradedb.match('description', 'tesla'), paradedb.match('content', 'tesla')]),
            paradedb.boolean(should => ARRAY[paradedb.boolean(should => ARRAY[paradedb.match('title', 'musk'), paradedb.match('description', 'musk'), paradedb.match('content', 'musk')]), paradedb.boolean(should => ARRAY[paradedb.match('title', 'model'), paradedb.match('description', 'model'), paradedb.match('content', 'model')])])
          ]
        )
        ORDER BY pdb.score(id) DESC, id
        LIMIT 100
      tiger:
        template: tiger_boolean
        params: { tsquery_expr: "tesla & (musk | model)", terms: "tesla musk model", limit: 100 }
      elasticsearch: |
        {"query": {"bool": {"must": [{"multi_match": {"query": "tesla", "fields": ["title", "description", "content"]}}, {"bool": {"should": [{"multi_match": {"query": "musk", "fields": ["title", "description", "content"]}}, {"multi_match": {"query": "model", "fields": ["title", "description", "content"]}}], "minimum_should_match": 1}}]}}, "size": 100, "_source": false, "track_total_hits": false}

