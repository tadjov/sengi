x-budget: &budget
  cpus: 4
  mem_limit: 6g

x-postgres: &postgres
  <<: *budget
  environment:
    POSTGRES_USER: news_user
    POSTGRES_PASSWORD: news_password
    POSTGRES_DB: news_db
  command: >-
    postgres
    -c shared_buffers=1536MB -c effective_cache_size=4608MB
    -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=3
    -c random_page_cost=1.1 -c effective_io_concurrency=200
    -c max_wal_size=16GB -c checkpoint_timeout=30min
  shm_size: 5gb

services:
  pg-news-native:
    <<: *postgres
    image: pgvector/pgvector:0.8.7-pg18-bookworm@sha256:38681dc6eaf55308e2a4c6de392d131652dcfac70e1263e35cd9b5ea3fe39782
    container_name: pg-native-news
    ports:
      - "54320:5432"
    volumes:
      - pg_news_data:/var/lib/postgresql

  pg-news-parade:
    <<: *postgres
    image: paradedb/paradedb:0.26.8-pg18@sha256:97a698fdf5dbd1748052f60eaf19befb716fe6313c990d91b365715e3d6532d9
    container_name: pg-parade-news
    # The image retunes work_mem and gather workers; they go back to stock here.
    command: >-
      postgres
      -c shared_buffers=1536MB -c effective_cache_size=4608MB
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=3
      -c random_page_cost=1.1 -c effective_io_concurrency=200
      -c max_wal_size=16GB -c checkpoint_timeout=30min
      -c work_mem=4MB -c max_parallel_workers_per_gather=2
    ports:
      - "54321:5432"
    volumes:
      - pg_news_parade_data:/var/lib/postgresql

  pg-news-tiger:
    <<: *postgres
    image: timescale/timescaledb-ha:pg18.7-ts2.32.1-r606.1@sha256:ff4362ab6890052930ef75a72d94b7072fcc510bc79c84722700c1b2b68f3474
    container_name: pg-tiger-news
    # The image retunes work_mem, jit, gather workers and TOAST compression at startup; they go back to stock here.
    # pg_textsearch.memory_limit is sighup, so no migration can SET it.
    command: >-
      postgres
      -c shared_buffers=1536MB -c effective_cache_size=4608MB
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=3
      -c random_page_cost=1.1 -c effective_io_concurrency=200
      -c max_wal_size=16GB -c checkpoint_timeout=30min
      -c work_mem=4MB -c jit=on -c max_parallel_workers_per_gather=2 -c default_toast_compression=pglz
      -c pg_textsearch.memory_limit=2GB
    ports:
      - "54322:5432"
    volumes:
      - pg_news_tiger_data:/home/postgres/pgdata/data

  elasticsearch:
    <<: *budget
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.5@sha256:13b4a40bb095774f5fda635e45fd5677cc6a26565e42b24997b0c72b88e75984
    container_name: es-news
    environment:
      - node.name=es-news
      - cluster.name=news-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    volumes:
      - es_news_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.5@sha256:13b72ce7222c36e4213229004ae62a87aeb32fd372ebfa6fb38f7a3285fdbb78
    container_name: kibana-news
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana-news
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch


volumes:
  pg_news_data:
    name: ${NEWS_VOLUME_NS:-sengi}_pg_news_data
    driver: local
  es_news_data:
    name: ${NEWS_VOLUME_NS:-sengi}_es_news_data
    driver: local
  pg_news_parade_data:
    name: ${NEWS_VOLUME_NS:-sengi}_pg_news_parade_data
    driver: local
  pg_news_tiger_data:
    name: ${NEWS_VOLUME_NS:-sengi}_pg_news_tiger_data
    driver: local
