# Every engine gets cpus: 8 and mem_limit: 7g. shared_buffers is 25% of it, effective_cache_size the rest,
# the Elasticsearch heap 50%, and the worker counts follow the cpus.
services:
  pg-news-native:
    image: pgvector/pgvector:pg18
    container_name: pg-native-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    command: >-
      postgres
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=7
      -c shared_buffers=1792MB -c effective_cache_size=5376MB -c work_mem=4MB
      -c random_page_cost=1.1 -c effective_io_concurrency=200 -c jit=on
      -c max_parallel_workers_per_gather=2 -c max_parallel_workers=8 -c max_worker_processes=27
      -c wal_buffers=16MB -c min_wal_size=80MB -c max_wal_size=16GB -c checkpoint_timeout=30min
      -c default_toast_compression=pglz -c autovacuum_naptime=60s -c autovacuum_max_workers=3
    shm_size: 5gb
    cpus: 8
    mem_limit: 7g
    ports:
      - "54320:5432"
    volumes:
      - pg_news_data:/var/lib/postgresql

  pg-news-parade:
    image: paradedb/paradedb:0.21.5-pg18
    container_name: pg-parade-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    command: >-
      postgres
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=7
      -c shared_buffers=1792MB -c effective_cache_size=5376MB -c work_mem=4MB
      -c random_page_cost=1.1 -c effective_io_concurrency=200 -c jit=on
      -c max_parallel_workers_per_gather=2 -c max_parallel_workers=8 -c max_worker_processes=27
      -c wal_buffers=16MB -c min_wal_size=80MB -c max_wal_size=16GB -c checkpoint_timeout=30min
      -c default_toast_compression=pglz -c autovacuum_naptime=60s -c autovacuum_max_workers=3
    shm_size: 5gb
    cpus: 8
    mem_limit: 7g
    ports:
      - "54321:5432"
    volumes:
      - pg_news_parade_data:/var/lib/postgresql

  pg-news-tiger:
    image: timescale/timescaledb-ha:pg18.6-ts2.32.0-r599.1
    container_name: pg-tiger-news
    environment:
      POSTGRES_USER: news_user
      POSTGRES_PASSWORD: news_password
      POSTGRES_DB: news_db
    # memory_limit is sighup, so no migration can SET it.
    command: >-
      postgres
      -c maintenance_work_mem=4GB -c max_parallel_maintenance_workers=7
      -c shared_buffers=1792MB -c effective_cache_size=5376MB -c work_mem=4MB
      -c random_page_cost=1.1 -c effective_io_concurrency=200 -c jit=on
      -c max_parallel_workers_per_gather=2 -c max_parallel_workers=8 -c max_worker_processes=27
      -c wal_buffers=16MB -c min_wal_size=80MB -c max_wal_size=16GB -c checkpoint_timeout=30min
      -c default_toast_compression=pglz -c autovacuum_naptime=60s -c autovacuum_max_workers=3
      -c pg_textsearch.memory_limit=2GB
    shm_size: 5gb
    cpus: 8
    mem_limit: 7g
    ports:
      - "54322:5432"
    volumes:
      - pg_news_tiger_data:/home/postgres/pgdata/data

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.12.0
    container_name: es-news
    environment:
      - node.name=es-news
      - cluster.name=news-cluster
      - discovery.type=single-node
      - bootstrap.memory_lock=true
      - "ES_JAVA_OPTS=-Xms3584m -Xmx3584m"
      - node.processors=8
      - xpack.security.enabled=false
      - xpack.security.enrollment.enabled=false
    ulimits:
      memlock:
        soft: -1
        hard: -1
    shm_size: 2gb
    cpus: 8
    mem_limit: 7g
    volumes:
      - es_news_data:/usr/share/elasticsearch/data
    ports:
      - "9200:9200"
      - "9300:9300"

  kibana:
    image: docker.elastic.co/kibana/kibana:8.12.0
    container_name: kibana-news
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - SERVER_NAME=kibana-news
      - SERVER_HOST=0.0.0.0
    ports:
      - "5601:5601"
    depends_on:
      - elasticsearch


volumes:
  pg_news_data:
    name: ${NEWS_VOLUME_NS:-tusker}_pg_news_data
    driver: local
  es_news_data:
    name: ${NEWS_VOLUME_NS:-tusker}_es_news_data
    driver: local
  pg_news_parade_data:
    name: ${NEWS_VOLUME_NS:-tusker}_pg_news_parade_data
    driver: local
  pg_news_tiger_data:
    name: ${NEWS_VOLUME_NS:-tusker}_pg_news_tiger_data
    driver: local
