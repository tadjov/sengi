# yaml-language-server: $schema=../../api/mapping-spec/mapping-v1.json
kind: Mapping
version: v1
name: all-the-news
description: "All the News 2.0 (Components One, rjac HF mirror), 2,688,878 articles from 27 US outlets, 2016-01..2020-04, full article bodies. The source columns idx, article_idx, year, month and day have no Article target and are dropped at fetch time."
constants:
  Language: eng
fields:
  - source: title
    target: Title
    required: true
  - source: article
    target: Content
  - source: author
    target: Metadata.Authors
  - source: url
    type: url
    target: URL
    required: true
  - source: url
    target: Metadata.ExternalID
  - source: date
    type: datetime
    format: "2006-01-02 15:04:05"
    target: PublishedAt
  - source: publication
    target: Metadata.PublisherName
  - source: section
    target: Metadata.Section
