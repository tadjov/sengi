# yaml-language-server: $schema=../../api/mapping-spec/mapping-v1.json
kind: Mapping
version: v1
name: cc-news
description: "CC-News (vblagoje/cc_news), 708,241 English articles, bodies extracted by news-please"
missingValues: [""]
constants:
  Language: eng
fields:
  - source: title
    target: Title
    required: true
  - source: text
    target: Content
  - source: description
    target: Description
  - source: url
    target: URL
    type: url
    required: true
  - source: url
    target: Metadata.ExternalID
  - source: date
    target: PublishedAt
    type: datetime
    format: "2006-01-02 15:04:05"
