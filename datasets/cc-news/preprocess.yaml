# yaml-language-server: $schema=../../api/preprocess-spec/preprocess-v1.json
kind: Preprocess
version: v1
name: cc-news
input: raw/datapackage.json
mapping: mapping.yaml
output:
  path: canonical
  format: parquet

id:
  kind: urlHash

unique:
  keep: first
  keys:
    - name: same-url
      fields: [URL]
    - name: same-page
      fields: [PublisherDomain, Title, Content]

rules:
  # From 3 headlines up, 85-91% of shared-body groups have unrelated headlines; at 2 only half do.
  - name: shared-body
    clear: Content
    when: {countDistinct: Title, groupBy: [PublisherDomain, Content], atLeast: 3}
  # Shared descriptions are site taglines from 5 headlines up; at 3-4 they still include real stories.
  - name: shared-description
    clear: Description
    when: {countDistinct: Title, groupBy: [PublisherDomain, Description], atLeast: 5}

checks:
  droppedOfRead: {warn: 1%, error: 2%}
  duplicatesOfRead: {warn: 8%, error: 10%}
  clearedOfWritten: {warn: 10%, error: 12%}
