# yaml-language-server: $schema=../../api/mapping-spec/mapping-v1.json
kind: Mapping
version: v1
name: global-news
description: "Kaggle Global News Dataset. The source column content is the truncated NewsAPI excerpt of full_content and has no Article target."
constants:
  Language: eng
fields:
  - source: title
    target: Title
    required: true
  - source: author
    target: Metadata.Authors
  - source: description
    target: Description
    required: true
  - source: full_content
    target: Content
  - source: url
    type: url
    target: URL
    required: true
  - source: article_id
    target: Metadata.ExternalID
  - source: published_at
    type: datetime
    format: "2006-01-02 15:04:05.000000"
    target: PublishedAt
  - source: source_id
    target: Metadata.Extra.sourceId
  - source: source_name
    target: Metadata.PublisherName
  - source: category
    target: Metadata.Section
